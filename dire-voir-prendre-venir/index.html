<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FLE Lab · Verbes dire, voir, prendre et venir</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f5ed;color:#263d40;font:18px "Atkinson Hyperlegible Next",system-ui,sans-serif}main{max-width:800px;margin:auto;padding:clamp(16px,4vw,40px)}header{font-weight:700;color:#506761}h1{font: bold clamp(32px,6vw,54px) Georgia;margin:12px 0 24px}nav,#choices{display:flex;flex-wrap:wrap;gap:10px}button,input{font:inherit;border-radius:12px;padding:12px 16px;border:1px solid #879c96;background:white;color:inherit}button{cursor:pointer}button:hover{background:#edf4ef}nav button[aria-pressed=true],.primary{background:#295a53;color:white}.primary:hover{background:#214940}section{margin-top:20px;background:white;border-radius:22px;padding:clamp(18px,4vw,36px);box-shadow:0 5px 25px #35463910}progress{width:100%;accent-color:#458377}h2{font-size:22px}.card{background:#f3ecfa;border-radius:14px;padding:22px;font: bold clamp(26px,4vw,36px) Georgia}button:focus-visible,input:focus-visible{outline:3px solid #8054a4;outline-offset:2px}#feedback{min-height:1.4em}input{width:min(100%,220px)}[hidden]{display:none!important}
#choices.panel{padding:16px;background:#f2f7f4;border:1px solid #9db9ad;border-radius:14px}#choices.panel button{min-width:78px}</style><main><header>FLE Lab · CE2</header><h1>Verbes dire, voir, prendre et venir</h1><nav aria-label="Niveaux"></nav><section><small id="status"></small><progress max="10" value="0" aria-label="Questions terminées"></progress><h2 id="task"></h2><p id="model"></p><p class="card" id="phrase"></p><div id="choices" role="group" aria-labelledby="task"></div><p aria-live="polite" id="feedback"></p><button hidden id="next" class="primary">Continuer</button></section></main><script>
const $=s=>document.querySelector(s);
const verbs=['avoir','être','faire','aller','dire','voir','prendre','venir'], forms=['ai as a avons avez ont','suis es est sommes êtes sont','fais fais fait faisons faites font','vais vas va allons allez vont','dis dis dit disons dites disent','vois vois voit voyons voyez voient','prends prends prend prenons prenez prennent','viens viens vient venons venez viennent'].map(x=>x.split(' '));
const ends=[["huit ans.", "besoin de colle.", "envie de jouer.", "faim après le sport.", "soif après la course.", "peur du noir.", "mal au genou.", "de la chance.", "deux frères.", "une idée pour le spectacle.", "besoin de ciseaux.", "envie de chanter.", "neuf ans.", "mal aux dents.", "peur des araignées.", "besoin d’aide.", "envie de rire.", "soif après le match.", "mal à la tête.", "faim avant le déjeuner."], ["en train de lire.", "de bonne humeur.", "en retard ce matin.", "à l’heure aujourd’hui.", "en avance pour le cours.", "en train de dessiner.", "de retour à la maison.", "en vacances cette semaine.", "en train de compter.", "en forme ce matin.", "de mauvaise humeur.", "en train de chanter.", "en pyjama ce matin.", "en train de goûter.", "de service à la cantine.", "en train de ranger la classe.", "en avance pour le spectacle.", "en train de lire la consigne.", "en train de préparer le goûter.", "en retard pour le bus."], ["un dessin au crayon.", "une addition sur l’ardoise.", "du vélo le dimanche.", "de la natation le mercredi.", "attention aux voitures.", "du judo après l’école.", "la queue à la cantine.", "de la musique le jeudi.", "du sport le matin.", "une soustraction au tableau.", "du jardinage avec la classe.", "la vaisselle après le repas.", "du patin à roulettes.", "de la danse le samedi.", "du théâtre à l’école.", "attention à la marche.", "du ski en hiver.", "la sieste après le déjeuner.", "du karaté le lundi.", "de l’escalade avec le groupe."], ["chercher un livre.", "jouer dehors.", "prendre le bus.", "rendre un livre.", "acheter du pain.", "retrouver les copains.", "nager à la piscine.", "voir le spectacle.", "ramasser des feuilles.", "lire dans le jardin.", "boire de l’eau.", "saluer la maîtresse.", "écouter une histoire.", "visiter le musée.", "chercher une règle.", "courir au parc.", "dessiner sous un arbre.", "voir les animaux.", "prendre une douche.", "ranger les pinceaux."]];
ends.push(...[["bonjour en entrant en classe.","merci après le goûter.","au revoir en quittant la classe.","la vérité sur le ballon perdu.","tout haut le mot écrit au tableau.","à voix basse : « Silence ! ».","pardon après une bousculade.","bonsoir en arrivant chez Mamie.","« Bravo ! » en applaudissant.","« À demain ! » avant de partir.","le contraire de « froid » à haute voix.","« Présent ! » à l’appel."],["au loin grâce aux jumelles un voilier blanc.","mieux de loin avec des lunettes.","à peine le tableau sans lunettes.","dans le miroir le reflet de la porte.","à travers la vitre les gouttes qui tombent.","dans le ciel un éclair qui brille.","au microscope les détails de la feuille.","à travers le télescope les cratères de la Lune.","au loin la fumée qui monte.","dans le noir deux petits yeux qui brillent.","par le hublot les nuages sous l’avion.","dans la flaque le reflet des arbres."],["le bus pour aller à l’école.","le train pour voyager jusqu’à Paris.","une grande inspiration avant de plonger.","la parole pour répondre à la question.","des notes pour retenir la leçon.","rendez-vous chez le dentiste.","place autour de la table.","soin du chat malade.","le métro pour rentrer à la maison.","une décision après la discussion.","le temps de relire la consigne.","part au tournoi de football."],["de la cantine pour rejoindre la classe.","du gymnase pour le cours de français.","de la cour pour retrouver le groupe.","de la bibliothèque avec des livres sous le bras.","du jardin avec des feuilles pour le collage.","de la cuisine avec un plateau de fruits.","du marché avec un panier de mangues.","de chez Mamie avec un gâteau pour le goûter.","du parc à pied pour le pique-nique.","de la gare en bus pour la fête.","de l’école à vélo pour le déjeuner.","de la piscine avec une serviette sur l’épaule."]]);
const directionClues = ['Le départ est dans une minute.', 'Il faut partir maintenant.', 'Le chemin est encore long.', 'La destination est encore loin.'];
const subs=['Je','Tu','Elle','Nous','Vous','Ils'], names=['1 · Trouve la forme','2 · Change de sujet','3 · Complète la phrase','4 · Les huit verbes'];
function mix(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let level,deck,index,step,miss,score;
const pools = names.map(() => verbs.map(() => []));
function drawEnding(l,v,used){
  const pool=pools[l][v];
  if(!pool.length) pool.push(...mix(ends[v].filter(e=>!used.has(e))));
  const end=pool.pop();
  used.add(end);
  return end;
}
function start(l){
  level=l; index=score=0;
  const order=mix(l===3?[0,1,2,3,4,5,6,7]:[4,5,6,7]);
  const slots=mix([...order,...order,...order].slice(0,10));
  const persons=verbs.map(()=>mix([0,1,2,3,4,5]));
  const used=new Set();
  deck=slots.map(v=>({v,p:persons[v].pop(),end:drawEnding(l,v,used)}));
  document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-pressed',i===l));begin()}
function begin(){step=0;miss=false;$('#feedback').textContent='';render()}
function line(p,v,word,end){let elide=p===0&&v===0;const clue=level===3&&v===3?directionClues[ends[v].indexOf(end)%directionClues.length]+' ':'';return clue+(elide?'J’':subs[p]+' ')+word+' '+end}
function render(){let {v,p,end}=deck[index],answer=forms[v][p];$('#next').hidden=true;const panel=level===1||(level>=2&&step===1);$('#choices').classList.toggle('panel',panel);$('#choices').replaceChildren();$('#status').textContent='Question '+(index+1)+' sur 10';$('progress').value=index;$('#task').textContent=['Choisis la forme du verbe au présent.','Choisis la forme qui convient au nouveau sujet.',step?'Choisis maintenant la forme qui convient.':'Quel verbe complète la phrase ?'][Math.min(level,2)];let source=(p+3)%6;$('#model').textContent=level===0?'Verbe à conjuguer · '+verbs[v]:level===1?line(source,v,forms[v][source],end):step?'Verbe choisi · '+verbs[v]:'';$('#phrase').textContent=line(p,v,'___',end);let options=panel?mix(forms[v]):level>=2&&!step?mix(level===3?verbs:verbs.slice(4)):mix([answer,...mix([...new Set(forms[v])].filter(x=>x!==answer)).slice(0,2)]);for(let x of options){let b=document.createElement('button');b.textContent=x;b.onclick=()=>check(x);$('#choices').append(b)}if(panel)$('#choices').firstElementChild.focus()}
function check(x){let {p,v,end}=deck[index],pick=level>=2&&!step,correct=pick?verbs[v]:forms[v][p];if(x.trim().normalize('NFC').toLowerCase()!==correct){miss=true;$('#feedback').textContent=pick?'Relis les mots après le trou. Quel est le sens de la phrase ?':'Regarde le sujet « '+subs[p].toLowerCase()+' ». Essaie encore.';return}if(pick){step=1;$('#feedback').textContent='Oui, le verbe est « '+verbs[v]+' ».';render();return}if(!miss)score++;$('#phrase').textContent=line(p,v,correct,end);$('#choices').replaceChildren();$('#choices').classList.remove('panel');$('#feedback').textContent='Bravo !';$('progress').value=index+1;$('#next').hidden=false;$('#next').textContent=index===9?'Voir mon bilan':'Continuer';$('#next').focus()}
$('#next').onclick=()=>{if(++index<10){begin();return}if(index>10){start(level);return}$('#status').textContent='Série terminée';$('#task').textContent=names[level];$('#model').textContent='';$('#phrase').textContent=score+' / 10';$('#feedback').textContent='Phrases réussies dès le premier essai.';$('#next').textContent='Rejouer ce niveau'};
names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>start(i);$('nav').append(b)});start(0);
</script></html>
