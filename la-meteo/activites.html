<style>
  :root { color-scheme: light; font: 17px/1.4 system-ui, sans-serif; --ink: #243a36; --green: #286256; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; color: var(--ink); background: radial-gradient(ellipse at 88% -20%, #d9efeb, transparent 65%), #faf8ee; }
  .shell { width: min(1050px, 100%); margin: 0 auto; padding: 0 clamp(10px, 3vw, 28px) 22px; }
  .masthead { min-height: 61px; display: flex; gap: 9px; align-items: center; border-bottom: 1px solid #d6e0d2; }
  .wordmark { color: var(--green); font-size: 1.12rem; font-weight: 850; }
  .wordmark span { font-weight: 600; }
  .portal-back { display: inline-flex; align-items: center; margin-left: auto; min-height: 36px; padding: 5px 11px; border: 1px solid #b8ccbf; color: var(--green); background: #fffefa; border-radius: 11px; text-decoration: none; font-size: .82rem; font-weight: 740; }
  .portal-back:hover { background: #e4eee1; }
  .folder-heading h1 { margin: 0; font-family: ui-serif, Georgia, serif; line-height: 1; letter-spacing: -.035em; }
  .menu { display: grid; gap: 12px; }
  .menu-card { display: grid; min-width: 0; background: #fffdf7; border-radius: 17px; border: 1px solid #d6e0d2; box-shadow: 0 10px 34px #37594a13; }
  .menu-card:hover { border-color: #719684; }
  .menu-card .topic { color: #50645d; font-size: .91rem; }

  .folder-heading { margin: 26px 0 16px; }
  .folder-heading h1 { font-size: clamp(2.7rem, 8vw, 5.25rem); }
  .weather-folder { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .weather-folder a { text-decoration: none; color: var(--ink); padding: 0; overflow: hidden; gap: 0; }
  .weather-folder a img { width: 100%; height: clamp(140px, 29vh, 245px); border-radius: 0; object-fit: cover; object-position: center 45%; }
  .folder-game { display: grid; gap: 5px; padding: 15px 17px 18px; }
  .folder-game strong { font-family: ui-serif, Georgia, serif; font-size: clamp(1.35rem, 4vw, 2rem); line-height: 1.12; }
  .folder-game small { font-weight: 670; color: var(--green); }
  .weather-folder a:focus-visible { outline: 3px solid #6b499a; outline-offset: 3px; }
  @media (max-width: 720px) {
    .weather-folder .menu-card:not(.dress-entry) { grid-template-columns: 1fr; grid-template-rows: auto; gap: 0; }
    .weather-folder .menu-card:not(.dress-entry) img { grid-row: auto; }
  }
  @media (max-width: 495px) { .weather-folder { grid-template-columns: 1fr; } }
</style>
