<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8ef">
<title>Le bulletin Météo · FLE Lab</title>
<style>
  :root {
    color-scheme: light;
    --ink: #213a47;
    --muted: #526974;
    --edge: #ccdeda;
    --paper: #fffefa;
    --green: #286458;
    --map: #edf7fa;
    font: 16px/1.45 system-ui, sans-serif;
    color: var(--ink);
    background: #faf8ef;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100dvh; background: radial-gradient(ellipse at 95% 0, #e2efe6, transparent 46rem); }
  h1, h2, p { margin: 0; }
  h1, .country-card strong { font-family: ui-serif, Georgia, serif; font-weight: 700; letter-spacing: -.035em; }
  button, a { touch-action: manipulation; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  button:focus-visible, a:focus-visible { outline: 3px solid #80549d; outline-offset: 3px; }
  .shell { width: min(1050px, 100%); margin: auto; padding: 0 clamp(10px, 2.5vw, 24px) 22px; }
  .masthead { display: flex; align-items: center; gap: 8px; min-height: 61px; border-bottom: 1px solid var(--edge); }
  .brand { margin-right: auto; padding: 6px 0; border: 0; background: transparent; font-size: 1.12rem; font-weight: 850; color: var(--green); }
  .brand span { font-weight: 600; }
  .back, .plain, .primary {
    display: inline-flex; justify-content: center; align-items: center; border: 1px solid var(--edge);
    border-radius: 11px; padding: 7px 12px; min-height: 36px;
    color: var(--green); background: var(--paper); font-size: .88rem; font-weight: 750; text-decoration: none;
  }
  .back:hover, .plain:hover { background: #e6f1e9; }
  .primary { color: #fff; background: var(--green); border-color: var(--green); min-height: 43px; padding-inline: 15px; }
  .primary:hover:not(:disabled) { background: #1e5147; }
  .primary:disabled { color: #4e605b; background: #e8eeea; border-color: #d5e0db; }
  .hero { margin: clamp(17px, 4vh, 38px) 0 13px; padding: clamp(24px, 5vw, 52px); border-radius: 22px; background: #e3eee3; }
  .hero h1 { font-size: clamp(2.6rem, 7.4vw, 4.8rem); line-height: 1; margin-bottom: 12px; }
  .hero p { color: #3e5e60; font-weight: 580; }
  .country-menu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .country-card {
    display: grid; text-align: left; padding: 0; border: 1px solid var(--edge); background: var(--paper);
    border-radius: 18px; overflow: hidden; box-shadow: 0 11px 24px #325e4910;
  }
  .country-card:hover { border-color: #527d75; }
  .country-card .card-map { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); justify-content: center; align-items: center; position: relative; gap: 8px; height: clamp(115px, 24vh, 214px); background: #e9f4fa; padding: 8px; }
  .country-card[data-country="malaisie"] .card-map { background: #e4f0e5; }
  .card-map canvas { display: block; height: 100%; width: 100%; min-height: 0; }
  .card-map img { position: absolute; width: 39px; height: 39px; right: 16%; top: 12%; }
  .card-title { padding: 13px 16px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .card-title strong { font-size: clamp(1.36rem, 3.4vw, 2rem); line-height: 1.15; }
  .card-title .arrow { font-size: 1.4rem; color: var(--green); }
  .game-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 11px 0 8px; }
  .game-heading h1 { font-size: clamp(1.55rem, 4vw, 2.4rem); line-height: 1.08; }
  .progress { flex: none; font-size: .84rem; color: var(--muted); font-weight: 750; font-variant-numeric: tabular-nums; }
  .country-map { display: grid; gap: 0; overflow: hidden; border: 1px solid #ccdfe6; border-radius: 17px; background: var(--map); }
  .country-map[data-country="malaisie"] { grid-template-columns: 92fr 86fr; }
  .map-panel { min-width: 0; }
  .map-panel + .map-panel { border-left: 1px solid #cbdfe7; }
  .map-label { margin: 4px 0 0; font-size: clamp(.74rem, 1.75vw, .92rem); font-weight: 730; text-align: center; color: #345d63; }
  .map-area { position: relative; height: min(46dvh, 407px); min-height: 232px; }
  .map-panel canvas { position: absolute; width: 100%; height: 100%; inset: 0; }
  .city {
    position: absolute; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 6px; min-height: clamp(26px, 4.2vw, 40px); white-space: nowrap;
    border: 1px solid #a8c3cc; border-radius: 10px; background: #fffffd;
    font-size: clamp(.71rem, 1.68vw, .99rem); font-weight: 740; line-height: 1.05;
    box-shadow: 0 2px 3px #2d5c6614;
  }
  .city img { width: clamp(18px, 3.65vw, 30px); height: clamp(18px, 3.65vw, 30px); pointer-events: none; }
  .city:disabled, .weather-choice:disabled { opacity: 1; color: var(--ink); }
  .city:hover:not(:disabled) { border-color: #36766a; background: #eff8f2; }
  .city[aria-pressed="true"] { outline: 2px solid #3d776b; outline-offset: 1px; background: #e6f3ed; }
  .city[aria-pressed="true"]:focus-visible { outline-color: #80549d; }
  .city[data-mark="correct"], .weather-choice[data-mark="correct"] { border-color: #357050; box-shadow: 0 0 0 2px #3c8254; background: #e4f4e4; }
  .city[data-mark="wrong"], .weather-choice[data-mark="wrong"] { border-color: #a0523a; box-shadow: 0 0 0 2px #b66754; background: #fbece5; }
  .city[data-mark] { outline: 0; }
  .question-panel, .finish { margin-top: 9px; padding: clamp(10px, 2vw, 18px); border: 1px solid var(--edge); border-radius: 17px; background: var(--paper); }
  .question-panel h2 { font-size: clamp(1.12rem, 2.9vw, 1.55rem); line-height: 1.24; }
  .expected { color: var(--muted); font-size: .76em; font-weight: 630; }
  .weather-options { margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .weather-choice { display: flex; align-items: center; gap: 5px; padding: 4px 8px; min-height: 43px; text-align: left; font-size: clamp(.75rem, 1.95vw, .94rem); font-weight: 720; line-height: 1.2; background: #fffffd; border: 1px solid #b8d0ca; border-radius: 10px; }
  .weather-choice:hover:not(:disabled) { background: #eaf5ed; border-color: #598473; }
  .weather-choice img { width: 29px; height: 29px; flex: none; }
  .answer-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 9px; min-height: 42px; }
  .feedback { color: var(--muted); font-size: .88rem; font-weight: 620; }
  .feedback[data-result="true"] { color: #275c41; }
  .feedback[data-result="false"] { color: #8b452f; }
  .finish { margin-top: 20px; padding: clamp(24px, 6vw, 58px); text-align: center; }
  .finish h1 { font-size: clamp(2rem, 5vw, 3rem); }
  .score { font-size: 2rem; color: var(--green); font-weight: 850; margin: 10px 0 16px; }
  .finish-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .source { margin: 8px 0 0; font-size: .67rem; color: var(--muted); text-align: right; }
  .source a { color: inherit; }
  @media (max-width: 590px) {
    .country-map[data-country="malaisie"] { grid-template-columns: 1fr; }
    .map-panel + .map-panel { border-left: 0; border-top: 1px solid #cbdfe7; }
    .country-map[data-country="malaisie"] .map-area { height: 235px; }
    .country-menu { gap: 7px; }
    .card-title { padding: 10px 8px; }
    .card-map img { width: 27px; height: 27px; }
  }
  @media (max-width: 430px) {
    .masthead { min-height: 52px; gap: 5px; }
    .brand { font-size: .97rem; }
    .back { font-size: .73rem; padding-inline: 6px; }
    .weather-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .city { padding-inline: 4px; gap: 2px; }
    .city img { width: 16px; height: 16px; }
  }
  @media (max-height: 760px) and (min-width: 591px) {
    .masthead { min-height: 48px; }
    .map-area { height: min(46dvh, 340px); }
    .question-panel { padding-block: 10px; }
  }
</style>

  function clearView() {
    mapObserver?.disconnect();
    mapObserver = new ResizeObserver(entries => {
      for (const entry of entries) entry.target.drawMap();
    });
  }

  function drawMap(canvas, panel, preview) {
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    if (!width || !height) return;
    const density = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(width * density);
    canvas.height = Math.round(height * density);
    const ctx = canvas.getContext('2d');
    const [left, top, mapWidth, mapHeight] = panel.box;
    const scaleX = canvas.width / mapWidth;
    const scaleY = canvas.height / mapHeight;
    const scale = Math.min(scaleX, scaleY);
    const offsetX = (canvas.width - mapWidth * scale) / 2;
    const offsetY = (canvas.height - mapHeight * scale) / 2;
    ctx.save();
    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, scale);
    ctx.translate(-left, -top);
    ctx.lineJoin = 'round';
    const outline = new Path2D(panel.outline);
    ctx.fillStyle = '#d0e7d8';
    ctx.strokeStyle = '#6f9d8b';
    ctx.lineWidth = 0.55;
    ctx.fill(outline);
    ctx.stroke(outline);
    ctx.restore();

    for (const city of panel.cities) {
      const x = offsetX + (city.point[0] - left) * scale;
      const y = offsetY + (city.point[1] - top) * scale;
      if (!preview) {
        const labelX = (city.label[0] - left) * scaleX;
        const labelY = (city.label[1] - top) * scaleY;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(labelX, labelY);
        ctx.lineWidth = density;
        ctx.strokeStyle = '#648290';
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(x, y, (preview ? 2.2 : 3.7) * density, 0, Math.PI * 2);
      ctx.fillStyle = '#315564';
      ctx.fill();
      ctx.lineWidth = 1.4 * density;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
    }
  }

  function attachCanvas(host, panel, preview = false) {
    const canvas = document.createElement('canvas');
    canvas.setAttribute('aria-hidden', 'true');
    canvas.drawMap = () => drawMap(canvas, panel, preview);
    // A fixed intrinsic size keeps the canvas from controlling its grid track.
    canvas.width = 1;
    canvas.height = 1;
    host.prepend(canvas);
    mapObserver.observe(canvas);
  }

  function showHome(focus = true) {
    clearView();
    game = undefined;
    main.innerHTML = `
      <section class="hero">
        <h1 tabindex="-1">Le bulletin Météo</h1>
        <p>Observe la carte et réponds à dix questions.</p>
      </section>
      <div class="country-menu">
        ${Object.entries(countries).map(([id, country]) => `
          <button type="button" class="country-card" data-country="${id}">
            <span class="card-map" aria-hidden="true">${icon(id === 'france' ? 'soleil' : 'pluie')}</span>
            <span class="card-title"><strong>${country.title}</strong><span class="arrow" aria-hidden="true">→</span></span>
          </button>`).join('')}
      </div>`;
    for (const card of main.querySelectorAll('[data-country]')) {
      const id = card.dataset.country;
      const preview = card.querySelector('.card-map');
      for (const panel of [...assets.countries[id]].reverse()) attachCanvas(preview, panel, true);
      card.addEventListener('click', () => start(id));
    }
    if (focus) main.querySelector('h1').focus({preventScroll: true});
  }

  function start(id) {
    const country = countries[id];
    const panels = assets.countries[id];
    const cities = panels.flatMap(panel => panel.cities);
    const association = shuffle(country.forecast);
    if (association.join('|') === lastForecasts.get(id)) {
      const other = association.findIndex(item => item !== association[0]);
      [association[0], association[other]] = [association[other], association[0]];
    }
    lastForecasts.set(id, association.join('|'));
    const forecast = new Map(cities.map((city, i) => [city.id, association[i]]));
    const weatherIds = [...new Set(country.forecast)];
    const cityQuestions = shuffle(cities).slice(0, 5).map(city => ({
      type: 'weather', prompt: 'Quel temps fait-il à ' + city.name + ' ?',
      weather: forecast.get(city.id), city, options: shuffle(weatherIds),
    }));
    const weatherQuestions = shuffle(weatherIds).slice(0, 5).map(id => ({
      type: 'city', prompt: weather[id][1], weather: id,
      cities: cities.filter(city => forecast.get(city.id) === id),
    }));
    game = {
      id, country, panels, forecast,
      questions: shuffle([...cityQuestions, ...weatherQuestions]),
      index: 0, score: 0, checked: false, selected: new Set(),
    };
    showGame();
  }

  function showGame() {
    clearView();
    main.innerHTML = `
      <div class="game-heading">
        <h1>${game.country.title}</h1>
        <p class="progress" id="progress"></p>
      </div>
      <div class="country-map" data-country="${game.id}" aria-label="Carte du bulletin météo"></div>
      <section class="question-panel" id="question-panel" aria-labelledby="prompt"></section>`;
    const map = main.querySelector('.country-map');
    for (const panel of game.panels) {
      const group = document.createElement('section');
      group.className = 'map-panel';
      group.setAttribute('aria-label', panel.name);
      if (game.id === 'malaisie') {
        const name = document.createElement('h2');
        name.className = 'map-label';
        name.textContent = panel.name;
        group.append(name);
      }
      const area = document.createElement('div');
      area.className = 'map-area';
      group.append(area);
      map.append(group);
      attachCanvas(area, panel);
      const [left, top, width, height] = panel.box;
      for (const city of panel.cities) {
        const forecast = game.forecast.get(city.id);
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'city';
        chip.dataset.city = city.id;
        chip.dataset.weather = forecast;
        chip.style.left = ((city.label[0] - left) / width * 100) + '%';
        chip.style.top = ((city.label[1] - top) / height * 100) + '%';
        chip.setAttribute('aria-label', city.name + ' · ' + weather[forecast][0]);
        chip.innerHTML = icon(forecast) + '<span>' + city.name + '</span>';
        chip.addEventListener('click', () => selectCity(city.id));
        area.append(chip);
      }
    }
    showQuestion();
  }

  function current() {
    return game.questions[game.index];
  }

  function showQuestion() {
    const question = current();
    const cityQuestion = question.type === 'city';
    game.selected.clear();
    game.checked = false;
    document.getElementById('progress').textContent = `Question ${game.index + 1} / ${game.questions.length}`;
    for (const chip of main.querySelectorAll('[data-city]')) {
      delete chip.dataset.mark;
      chip.disabled = !cityQuestion;
      if (cityQuestion) chip.setAttribute('aria-pressed', 'false');
      else chip.removeAttribute('aria-pressed');
    }

    const panel = document.getElementById('question-panel');
    panel.innerHTML = `
      <h2 id="prompt" tabindex="-1">${question.prompt}${question.cities?.length === 2 ? ' <span class="expected">(deux villes)</span>' : ''}</h2>
      ${cityQuestion ? '' : '<div class="weather-options" role="group" aria-label="Réponses possibles">' +
        question.options.map(id => `<button type="button" class="weather-choice" data-answer="${id}">${icon(id)}<span>${weather[id][0]}</span></button>`).join('') + '</div>'}
      <div class="answer-bar">
        <p id="feedback" class="feedback" aria-live="polite">${cityQuestion ? cityInstruction(question.cities.length) : ''}</p>
        ${cityQuestion ? '<button type="button" class="primary" data-validate disabled>Valider</button>' : ''}
        <button type="button" class="primary" data-next hidden>${game.index === 9 ? 'Voir le résultat →' : 'Question suivante →'}</button>
      </div>`;
    for (const option of panel.querySelectorAll('[data-answer]')) {
      option.addEventListener('click', () => checkAnswer(option.dataset.answer));
    }
    panel.querySelector('[data-validate]')?.addEventListener('click', () => checkAnswer());
    panel.querySelector('[data-next]').addEventListener('click', nextQuestion);
    panel.querySelector('h2').focus({preventScroll: true});
  }

  function cityInstruction(count) {
    return count === 1 ? 'Clique sur une ville de la carte.' : 'Clique sur deux villes de la carte.';
  }

  function selectCity(id) {
    const question = current();
    if (game.checked || question.type !== 'city') return;
    const limit = question.cities.length;
    if (game.selected.has(id)) {
      game.selected.delete(id);
    } else if (limit === 1) {
      game.selected = new Set([id]);
    } else if (game.selected.size < limit) {
      game.selected.add(id);
    } else {
      document.getElementById('feedback').textContent = 'Clique à nouveau sur une ville pour la désélectionner.';
      return;
    }

    for (const chip of main.querySelectorAll('[data-city]')) {
      chip.setAttribute('aria-pressed', String(game.selected.has(chip.dataset.city)));
    }
    const count = game.selected.size;
    main.querySelector('[data-validate]').disabled = count !== limit;
    document.getElementById('feedback').textContent = count === 0 ? cityInstruction(limit)
      : count === 1 ? (limit === 1 ? 'Une ville sélectionnée.' : 'Une ville sélectionnée sur deux.')
      : 'Deux villes sélectionnées.';
  }

  function checkAnswer(answer) {
    if (game.checked) return;
    const question = current();
    const cityQuestion = question.type === 'city';
    if (cityQuestion && game.selected.size !== question.cities.length) return;
    const cities = cityQuestion ? question.cities : [question.city];
    const correct = cityQuestion ? cities.every(city => game.selected.has(city.id)) : answer === question.weather;
    game.checked = true;
    if (correct) game.score++;

    if (cityQuestion) {
      const answers = new Set(cities.map(city => city.id));
      for (const chip of main.querySelectorAll('[data-city]')) {
        const id = chip.dataset.city;
        chip.disabled = true;
        if (answers.has(id)) chip.dataset.mark = 'correct';
        else if (game.selected.has(id)) chip.dataset.mark = 'wrong';
      }
      main.querySelector('[data-validate]').hidden = true;
    } else {
      for (const option of main.querySelectorAll('[data-answer]')) {
        const id = option.dataset.answer;
        option.disabled = true;
        if (id === question.weather) option.dataset.mark = 'correct';
        else if (id === answer) option.dataset.mark = 'wrong';
      }
    }

    const place = cities.map(city => 'à ' + city.name).join(' et ');
    const statement = weather[question.weather][0].slice(0, -1) + ' ' + place + '.';
    const feedback = document.getElementById('feedback');
    feedback.dataset.result = String(correct);
    feedback.textContent = (correct ? 'Bravo ! ' : 'Réponse attendue. ') + statement;
    const next = main.querySelector('[data-next]');
    next.hidden = false;
    next.focus({preventScroll: true});
  }

  function nextQuestion() {
    if (!game.checked) return;
    game.index++;
    if (game.index < game.questions.length) showQuestion();
    else showResult();
  }

  function showResult() {
    clearView();
    main.innerHTML = `
      <section class="finish">
        <h1 tabindex="-1">Bulletin terminé</h1>
        <p class="score">${game.score} / ${game.questions.length}</p>
        <div class="finish-actions">
          <button type="button" class="primary" data-replay>Rejouer</button>
          <button type="button" class="plain" data-countries>Choisir un pays</button>
        </div>
      </section>`;
    main.querySelector('[data-replay]').addEventListener('click', () => start(game.id));
    main.querySelector('[data-countries]').addEventListener('click', () => showHome());
    main.querySelector('h1').focus({preventScroll: true});
  }

  document.querySelector('[data-home]').addEventListener('click', () => showHome());
  showHome(false);
})();
</script>
</body>
</html>
