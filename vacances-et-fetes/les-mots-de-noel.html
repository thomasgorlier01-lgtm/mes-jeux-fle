<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f1f5ed">
<title>Les mots de Noël</title>
<style>
  :root {
    color-scheme: light;
    --fond: #f1f5ed;
    --papier: #fffefa;
    --texte: #243e36;
    --doux: #4f675f;
    --vert: #245849;
    --fonce: #184638;
    --ligne: #d7e2d9;
    --accent: #d7e9db;
    --rose: #f7ece6;
    --focus: #986429;
    font-family: "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-width: 280px;
    min-height: 100vh;
    color: var(--texte);
    background: radial-gradient(ellipse at 15% 5%, #fdfaf0 0, transparent 43%), var(--fond);
  }
  button, input { font: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:disabled { cursor: default; }
  button:focus-visible, input:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  .shell { width: min(1180px, 100% - 64px); margin-inline: auto; padding-block: 28px 32px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
  .title-group { display: flex; align-items: center; gap: 14px; }
  .title-icon {
    display: grid;
    flex: 0 0 auto;
    place-items: center;
    width: 50px;
    aspect-ratio: 1;
    border: 1px solid #bdd8c6;
    border-radius: 17px;
    background: var(--accent);
    color: var(--vert);
    font-size: 34px;
    line-height: 1;
  }
  h1, h2, p { margin: 0; }
  h1 { font-size: clamp(30px, 4.2vw, 48px); font-weight: 800; letter-spacing: -.045em; line-height: 1.04; }
  h2 { font-size: clamp(24px, 3.1vw, 36px); line-height: 1.12; letter-spacing: -.035em; }

  .weeks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 9px; }
  .week {
    min-height: 63px;
    border: 1px solid var(--ligne);
    border-radius: 15px;
    text-align: left;
    background: #fbfcf7;
    color: var(--texte);
    padding: 8px 14px;
  }
  .week small { display: block; color: var(--doux); font-weight: 700; font-size: .72rem; line-height: 1.4; }
  .week strong { display: block; font-weight: 760; font-size: clamp(.88rem, 1.45vw, 1.08rem); }
  .week:hover { border-color: #9db8a8; }
  .week[aria-pressed="true"] {
    background: var(--accent);
    border-color: #93b5a2;
    box-shadow: inset 0 -3px #a4c5b0;
  }
  .week--story { background: #fff4e9; }
  .story-icon { margin-inline-end: .25em; }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-block: 14px;
  }
  .modes {
    display: inline-flex;
    gap: 4px;
    border-radius: 16px;
    border: 1px solid var(--ligne);
    background: #e9efe6;
    padding: 4px;
  }
  .mode {
    border: 0;
    border-radius: 11px;
    min-height: 44px;
    padding-inline: 17px;
    color: var(--texte);
    background: transparent;
    font-weight: 750;
  }
  .mode:hover { background: #fcfdf8; }
  .mode[aria-pressed="true"] { color: white; background: var(--vert); }
  .revision {
    display: inline-flex;
    gap: 9px;
    align-items: center;
    min-height: 42px;
    color: var(--vert);
    font-weight: 700;
    font-size: .94rem;
    cursor: pointer;
  }
  .revision input { accent-color: var(--vert); width: 20px; height: 20px; flex: 0 0 auto; }

  .panel {
    border: 1px solid var(--ligne);
    background: var(--papier);
    border-radius: 25px;
    padding: clamp(15px, 2.2vw, 28px);
    box-shadow: 0 12px 34px #2447390b;
  }
  .discovery { display: grid; grid-template-columns: minmax(0, 1.46fr) minmax(0, 1fr); align-items: stretch; gap: 24px; }
  .illustration {
    display: grid;
    place-items: center;
    min-height: 320px;
    margin: 0;
    border-radius: 19px;
    background: radial-gradient(ellipse at 47% 54%, #fffaf0 0%, #fffaf0 37%, transparent 38%), var(--rose);
    overflow: hidden;
  }
  .illustration img { width: min(94%, 420px, 54dvh); height: auto; display: block; object-fit: contain; aspect-ratio: 1; }
  .word-controls { display: flex; flex-direction: column; align-items: flex-start; padding: 6px 0; }
  .counter { display: block; color: var(--doux); font-size: .92rem; font-weight: 750; font-variant-numeric: tabular-nums; }
  .word-core { flex: 1; width: 100%; display: grid; align-content: center; justify-items: start; gap: 12px; min-height: 178px; padding-block: 22px; }
  .word-core > p { color: var(--doux); line-height: 1.36; }
  .answer-word { font-size: clamp(29px, 5.3vw, 56px); font-weight: 800; line-height: 1.02; letter-spacing: -.04em; }
  .pagination { display: flex; width: 100%; gap: 8px; flex-wrap: wrap; }
  .primary, .secondary {
    min-height: 46px;
    padding: 10px 16px;
    border: 1px solid transparent;
    border-radius: 12px;
    line-height: 1.15;
    font-weight: 750;
  }
  .primary { background: var(--vert); color: #fff; }
  .primary:hover { background: var(--fonce); }
  .secondary { background: #f2f6ee; color: var(--vert); border-color: var(--ligne); }
  .secondary:hover:enabled { border-color: #a0baa9; background: #e5efe5; }
  .secondary:disabled { color: #62756d; opacity: .55; }
  .primary[aria-expanded="true"] { background: #e3f0e5; color: var(--vert); border-color: #b9d2c2; }

  .story { margin-top: 14px; text-align: center; }
  .story h2 { font-size: clamp(22px, 3vw, 32px); }
  .story figure { margin: 12px 0; }
  .story-illustration {
    width: min(100%, 84dvh, 920px);
    margin-inline: auto;
    aspect-ratio: 3 / 2;
    overflow: hidden;
    border-radius: 16px;
    background: #e6efef;
  }
  .story-illustration img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .story-layout.with-letter {
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(180px, 28%, 250px);
    align-items: center;
    gap: clamp(12px, 2.5vw, 28px);
    width: min(100%, 116dvh, 1130px);
    margin-inline: auto;
  }
  .story-layout.with-letter .story-illustration { width: 100%; }
  .story-letter {
    aspect-ratio: 210 / 297;
    padding: 15% 10% 10% 13%;
    border: 1px solid #e1d6c6;
    background: linear-gradient(90deg, transparent 8.6%, #e8bcbc70 8.6% 9%, transparent 9%),
      linear-gradient(140deg, #fffefa, #fff9ee);
    color: #2d4268;
    box-shadow: 0 5px 15px #54473520;
    font-family: "Chalkboard SE", "Comic Sans MS", "Trebuchet MS", sans-serif;
    font-size: clamp(1rem, 2.5vmin, 1.28rem);
    font-weight: 600;
    line-height: 1.37;
    text-align: left;
  }
  .story-letter p + p { margin-top: .9em; }
  .story-caption {
    margin: 10px auto 0;
    max-width: 44ch;
    font-size: clamp(1.04rem, 2.65vmin, 1.64rem);
    font-weight: 750;
    line-height: 1.25;
    text-wrap: balance;
  }
  .story-pagination { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .story-pagination .counter { min-width: 3.3rem; }

  .quiz-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .quiz-heading h2 { margin-top: 4px; }
  .choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(7px, 2vw, 16px); }
  .choice {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 136px;
    padding: 4px;
    border: 2px solid #e9d9d2;
    border-radius: 18px;
    background: radial-gradient(ellipse at center, #fffaf1 55%, transparent 56%), var(--rose);
    overflow: hidden;
  }
  .choice:nth-child(2) {
    background: radial-gradient(ellipse at center, #fbfaf1 55%, transparent 56%), #e8f1e9;
    border-color: #d4e3d7;
  }
  .choice:nth-child(3) {
    background: radial-gradient(ellipse at center, #f8fbf8 55%, transparent 56%), #edf0f6;
    border-color: #dbe1eb;
  }
  .choice:hover:enabled { border-color: #769889; }
  .choice img { width: min(100%, 295px); max-height: min(38dvh, 280px); aspect-ratio: 1; object-fit: contain; display: block; }
  .choice[data-state="wrong"]:enabled { border-color: #a05d54; }
  .choice[data-state="right"] { border-color: #3c775d; box-shadow: inset 0 0 0 2px #3c775d; }
  .choice[data-state="other"] { opacity: .64; }
  .quiz-actions { margin-top: 14px; min-height: 47px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .feedback { color: var(--vert); font-size: clamp(16px, 2.25vw, 23px); font-weight: 800; }
  .feedback.retry { color: #833e34; }
  .finish { display: grid; justify-items: center; place-content: center; gap: 16px; min-height: 335px; text-align: center; }
  .finish img { width: 122px; aspect-ratio: 1; }
  .illustration img, .choice img, .finish img { border-radius: 12px; }
  .finish .pagination { justify-content: center; }
  .cue {
    color: var(--texte);
    width: min(500px, 100% - 24px);
    text-align: center;
    border: 1px solid var(--ligne);
    border-radius: 20px;
    padding: 28px 18px;
    box-shadow: 0 16px 70px #14271e38;
    background: var(--papier);
  }
  .cue::backdrop { background: #1e382bbb; }
  .cue > p { margin-block: 12px 20px; font-size: clamp(22px, 4vw, 33px); font-weight: 800; }
  .fle-fullscreen-on .top { padding-right: 40px; }

  @media (max-width: 760px) {
    .shell { width: calc(100% - 32px); padding-top: 16px; }
    .top { margin-bottom: 15px; }
    .title-icon { width: 40px; border-radius: 13px; font-size: 27px; }
    .week { min-height: 56px; padding-inline: 9px; }
    .discovery { gap: 15px; }
    .illustration { min-height: 265px; }
  }
  @media (max-width: 600px) {
    .weeks { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .week--story { grid-column: 1 / -1; }
    .story-layout.with-letter { grid-template-columns: minmax(0, 1fr); justify-items: center; }
    .story-letter { width: min(100%, 225px); padding: 1.6rem 1.35rem 1.35rem 1.7rem; }
    .story-pagination { gap: 5px; }
    .story-pagination button { padding-inline: 7px; font-size: .85rem; }
    .controls { flex-direction: column; align-items: flex-start; margin-block: 10px; gap: 3px; }
    .mode { padding-inline: 12px; }
    .panel { border-radius: 19px; padding: 12px; }
    .discovery { grid-template-columns: 1fr; gap: 2px; }
    .illustration { min-height: 180px; }
    .illustration img { width: min(85%, 236px); }
    .word-controls { padding: 7px 1px 0; }
    .word-core { min-height: 112px; padding-block: 10px; gap: 7px; }
    .quiz-heading { margin-bottom: 12px; }
    .quiz-heading h2 { font-size: 22px; }
    .choice { padding: 1px; border-radius: 12px; min-height: 83px; }
    .cue-open { font-size: .87rem; padding-inline: 9px; }
    .quiz-actions { margin-top: 8px; }
  }
  @media (min-width: 761px) and (max-height: 710px) {
    .shell { padding-top: 15px; }
    .top { margin-bottom: 13px; }
    .week { min-height: 53px; }
    .controls { margin-block: 8px; }
    .illustration { min-height: 240px; }
  }
  .noel-symbols { position: absolute; width: 0; height: 0; overflow: hidden; }
  .workshop {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
    gap: clamp(15px, 2.1vw, 26px);
  }
  .workshop-visual {
    display: grid;
    place-items: center;
    overflow: hidden;
    min-height: 325px;
    border-radius: 19px;
    background: radial-gradient(ellipse at 48% 40%, #fffaf0 15%, transparent 73%), #e8efe5;
  }
  #workshop[data-workshop="santa"] .workshop-visual {
    background: radial-gradient(ellipse at 48% 40%, #fffaf0 15%, transparent 73%), #f6e9e5;
  }
  .workshop-scene { position: relative; width: min(100%, 420px); }
  .workshop-scene svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .tree-targets { position: absolute; inset: 0; pointer-events: none; }
  .tree-target {
    position: absolute;
    display: grid;
    place-items: center;
    width: 10%;
    aspect-ratio: 1;
    padding: 0;
    transform: translate(-50%, -50%);
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #2e5b4c;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
  }
  .tree-target::before {
    content: "+";
    display: grid;
    place-items: center;
    width: clamp(16px, 62%, 25px);
    aspect-ratio: 1;
    border: 1px dashed #3c6255;
    border-radius: 50%;
    background: #f8fbebec;
    font-size: clamp(14px, 2.1vw, 19px);
    line-height: 1;
  }
  .tree-target.occupied::before { visibility: hidden; }
  .tree-target:focus-visible::before { visibility: visible; }
  @media (hover: hover) {
    .tree-target:hover::before { visibility: visible; border-style: solid; background: #fffbe4; }
  }
  .workshop-controls { display: grid; align-content: start; gap: 11px; }
  .peer-instruction { color: var(--doux); line-height: 1.35; max-width: 42ch; }
  .workshop-group { display: grid; gap: 5px; }
  .workshop-label { font-size: .85rem; font-weight: 750; color: var(--doux); }
  .piece-list, .color-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  #workshop[data-workshop="tree"] .piece-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .piece-option, .color-option {
    min-height: 44px;
    padding: 5px 3px;
    border: 1px solid var(--ligne);
    border-radius: 9px;
    background: #fcfdf8;
    color: var(--texte);
    font-size: clamp(.74rem, 1.3vw, .90rem);
    font-weight: 700;
    overflow-wrap: anywhere;
  }
  .piece-option { display: grid; justify-items: center; align-content: center; gap: 2px; }
  .piece-option svg { width: min(34px, 100%); height: 24px; --piece: #9db7aa; pointer-events: none; }
  .piece-option[aria-pressed="true"], .color-option[aria-pressed="true"] {
    border-color: #598675;
    background: #e5f0e6;
    box-shadow: inset 0 0 0 1px #598675;
  }
  .piece-option:hover, .color-option:hover { border-color: #598675; }
  .color-option { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; justify-content: start; gap: 5px; padding-inline: 6px; text-align: left; }
  .color-dot { display: block; width: 17px; height: 17px; border-radius: 50%; border: 1px solid #34453d70; }
  .oral-example {
    line-height: 1.35;
    padding: 10px 13px;
    border-radius: 12px;
    background: #f1f6ee;
    color: var(--vert);
    overflow-wrap: break-word;
  }
  .oral-example span { display: block; font-size: .78rem; font-weight: 750; color: var(--doux); margin-bottom: 3px; }
  .workshop-feedback { min-height: 1.1em; color: var(--doux); font-size: .86rem; }
  .workshop-actions { align-self: end; gap: 6px; }
  .workshop-actions button { min-height: 44px; padding-inline: 11px; }

  @media (max-width: 850px) {
    .color-option { gap: 4px; }
    .color-dot { width: 14px; height: 14px; }
  }
  @media (min-width: 701px) and (max-width: 880px) {
    .color-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 700px) {
    .workshop { grid-template-columns: minmax(0, 1fr); }
    .workshop-visual { min-height: 0; }
    .workshop-scene { width: min(100%, 310px, 40dvh); }
    .color-option { font-size: .82rem; }
  }
  @media (max-width: 600px) {
    .modes { flex-wrap: wrap; }
    .mode { min-height: 42px; padding-inline: 9px; font-size: .9rem; }
  }
</style>
</head>

<script>
"use strict";

const images = {
  "sapin": "assets/vocabulaire/sapin.webp",
  "boules": "assets/vocabulaire/boules.webp",
  "guirlandes": "assets/vocabulaire/guirlandes.webp",
  "etoile": "assets/vocabulaire/etoile.webp",
  "pere": "assets/vocabulaire/pere-noel.webp",
  "manteau": "assets/vocabulaire/manteau.webp",
  "bonnet": "assets/vocabulaire/bonnet.webp",
  "bottes": "assets/vocabulaire/bottes.webp",
  "hotte": "assets/hotte-osier.webp",
  "traineau": "assets/vocabulaire/traineau.webp",
  "rennes": "assets/vocabulaire/rennes.webp",
  "nord": "assets/pole-nord.webp",
  "elfes": "assets/vocabulaire/lutins.webp",
  "cadeaux": "assets/vocabulaire/cadeaux.webp",
  "pantalon": "assets/vocabulaire/pantalon.webp"
};
const vocabulary = {
  sapin: ["le sapin", "un sapin"],
  boules: ["les boules", "des boules"],
  guirlandes: ["les guirlandes", "des guirlandes"],
  etoile: ["l’étoile", "une étoile"],
  pere: ["le père Noël", "le père Noël"],
  manteau: ["le manteau", "un manteau"],
  pantalon: ["le pantalon", "un pantalon"],
  bonnet: ["le bonnet", "un bonnet"],
  bottes: ["les bottes", "des bottes"],
  hotte: ["la hotte", "une hotte"],
  traineau: ["le traîneau", "un traîneau"],
  rennes: ["les rennes", "des rennes"],
  nord: ["le pôle Nord", "le pôle Nord"],
  elfes: ["les lutins", "des lutins"],
  cadeaux: ["les cadeaux", "des cadeaux"]
};
const weeks = [
  ["sapin", "boules", "guirlandes", "etoile"],
  ["pere", "manteau", "pantalon", "bonnet", "bottes"],
  ["hotte", "traineau", "rennes"],
  ["nord", "elfes", "cadeaux"]
];
const byId = (id) => document.getElementById(id);
const weekButtons = [...document.querySelectorAll("[data-week]")];
const discover = byId("discover");
const quiz = byId("quiz");
const discoverButton = byId("discover-mode");
const quizButton = byId("quiz-mode");
const workshopButton = byId("workshop-mode");
const revision = byId("revision");
const word = byId("discovery-word");
const toggleWord = byId("toggle-word");
const backWord = byId("word-back");
const nextWord = byId("word-next");
const choiceGroup = byId("choices");
const feedback = byId("quiz-feedback");
const nextQuestion = byId("quiz-next");
const cue = byId("cue");
let week = 0;
let mode = "discover";
let cardIndex = 0;
let wordVisible = false;
let rounds = [];
let roundIndex = 0;
let solved = false;

function shuffled(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function renderWord() {
  const items = weeks[week];
  const key = items[cardIndex];
  const image = byId("discovery-image");
  image.src = images[key];
  image.alt = vocabulary[key][1];
  byId("discovery-count").textContent = `Carte ${cardIndex + 1} sur ${items.length}`;
  byId("discover-title").hidden = wordVisible;
  discover.querySelector(".word-core > p").hidden = wordVisible;
  word.textContent = wordVisible ? vocabulary[key][0] : "";
  toggleWord.textContent = wordVisible ? "Masquer le mot" : "Afficher le mot";
  toggleWord.setAttribute("aria-expanded", String(wordVisible));
  backWord.disabled = cardIndex === 0;
  nextWord.textContent = cardIndex === items.length - 1 ? "Revoir les cartes" : "Suivant";
}

function makeQuiz() {
  const current = shuffled(weeks[week]);
  const earlier = weeks.slice(0, week).flat();
  const mixed = week > 0 && revision.checked;
  if (current.length === 3) current.push(current[0]);
  if (mixed) {
    const review = shuffled(earlier).slice(0, 6 - current.length);
    review.forEach((key, index) => current.splice(index === 0 ? 1 : 4, 0, key));
  }
  const pool = mixed ? [...weeks[week], ...earlier] : weeks[week];
  rounds = current.map((key) => ({
    key,
    options: shuffled([key, ...shuffled(pool.filter((item) => item !== key)).slice(0, 2)])
  }));
  roundIndex = 0;
  byId("quiz-round").hidden = false;
  byId("quiz-end").hidden = true;
  renderQuestion();
}

function renderQuestion() {
  const round = rounds[roundIndex];
  solved = false;
  byId("quiz-count").textContent = `Question ${roundIndex + 1} sur ${rounds.length}`;
  feedback.textContent = "";
  feedback.classList.remove("retry");
  nextQuestion.hidden = true;
  nextQuestion.textContent = roundIndex < rounds.length - 1 ? "Question suivante" : "Terminer";
  choiceGroup.replaceChildren(...round.options.map((key) => {
    const button = document.createElement("button");
    button.className = "choice";
    button.type = "button";
    button.dataset.word = key;
    const image = new Image(528, 528);
    image.src = images[key];
    image.alt = vocabulary[key][1];
    button.append(image);
    button.addEventListener("click", () => choose(button, key));
    return button;
  }));
}

function choose(button, key) {
  if (solved) return;
  const answer = rounds[roundIndex].key;
  if (key !== answer) {
    button.dataset.state = "wrong";
    feedback.textContent = "Essaie encore.";
    feedback.classList.add("retry");
    return;
  }

  solved = true;
  for (const option of choiceGroup.children) {
    option.dataset.state = option === button ? "right" : "other";
    option.disabled = true;
  }
  feedback.classList.remove("retry");
  const phrase = vocabulary[key][1];
  const introduction = phrase.startsWith("des ") ? "Ce sont" : "C’est";
  feedback.textContent = `Bravo ! ${introduction} ${phrase}.`;
  byId("show-cue").disabled = true;
  nextQuestion.hidden = false;
  nextQuestion.focus();
}

function renderMode() {
  const isQuiz = mode === "quiz";
  const isWorkshop = mode === "workshop";
  discover.hidden = mode !== "discover";
  quiz.hidden = !isQuiz;
  workshop.hidden = !isWorkshop;
  discoverButton.setAttribute("aria-pressed", String(mode === "discover"));
  quizButton.setAttribute("aria-pressed", String(isQuiz));
  workshopButton.setAttribute("aria-pressed", String(isWorkshop));
  workshopButton.hidden = week > 1;
  workshopButton.textContent = week === 0 ? "Décorer le sapin" : "Habiller le père Noël";
  byId("revision-label").hidden = !isQuiz || week === 0;
  if (isQuiz) {
    makeQuiz();
    byId("show-cue").disabled = false;
  } else if (isWorkshop) {
    renderWorkshop();
  } else {
    renderWord();
  }
}

function pickMode(nextMode) {
  if (mode === nextMode) return;
  mode = nextMode;
  renderMode();
}

const storyScenes = [
  ["01-sapin", "Les enfants décorent le sapin avec des boules, des guirlandes et des étoiles."],
  ["02-lettre", "Au pôle Nord, le père Noël lit les lettres des enfants devant sa maison."],
  ["03-atelier", "Les lutins et le père Noël préparent les cadeaux."],
  ["04-chargement", "Le père Noël et les lutins chargent les cadeaux sur le traîneau."],
  ["05-decollage", "Le père Noël vole avec son traîneau et ses rennes pour apporter leurs cadeaux aux enfants sages."],
  ["06-cheminee", "Le père Noël arrive sur le toit et descend par la cheminée."],
  ["07-deposer", "Il dépose les cadeaux devant le sapin."],
  ["08-ouvrir", "Le matin de Noël, les enfants ouvrent leurs cadeaux."],
  ["09-cadeaux", "Ils découvrent le vélo, le ballon et l’ours en peluche."]
];
const story = byId("histoire");
const storyTab = byId("story-tab");
const storyImage = byId("story-image");
const storyBack = byId("story-back");
const storyNext = byId("story-next");
let storyIndex = 0;

function renderStory() {
  const [image, caption] = storyScenes[storyIndex];
  storyImage.src = `assets/${image}.webp`;
  byId("story-caption").textContent = caption;
  const hasLetter = image === "02-lettre";
  byId("story-letter").hidden = !hasLetter;
  byId("story-layout").classList.toggle("with-letter", hasLetter);
  byId("story-counter").textContent = `${storyIndex + 1} / ${storyScenes.length}`;
  storyBack.disabled = storyIndex === 0;
  storyNext.disabled = storyIndex === storyScenes.length - 1;
}

function selectStory(open) {
  story.hidden = !open;
  byId("vocabulary-activities").hidden = open;
  storyTab.setAttribute("aria-pressed", String(open));
  weekButtons.forEach((button, index) => button.setAttribute("aria-pressed", String(!open && week === index)));
  if (open && !storyImage.hasAttribute("src")) renderStory();
}

storyTab.addEventListener("click", () => selectStory(true));
storyBack.addEventListener("click", () => {
  storyIndex -= 1;
  renderStory();
  if (storyBack.disabled) storyNext.focus();
});
storyNext.addEventListener("click", () => {
  storyIndex += 1;
  renderStory();
  if (storyNext.disabled) storyBack.focus();
});

weekButtons.forEach((button, index) => {
  button.addEventListener("click", () => {
    if (week === index) {
      selectStory(false);
      return;
    }
    week = index;
    if (week > 1 && mode === "workshop") mode = "discover";
    cardIndex = 0;
    wordVisible = false;
    selectStory(false);
    renderMode();
  });
});
discoverButton.addEventListener("click", () => pickMode("discover"));
quizButton.addEventListener("click", () => pickMode("quiz"));
workshopButton.addEventListener("click", () => pickMode("workshop"));
revision.addEventListener("change", () => renderMode());

toggleWord.addEventListener("click", () => {
  wordVisible = !wordVisible;
  renderWord();
});
backWord.addEventListener("click", () => {
  cardIndex -= 1;
  wordVisible = false;
  renderWord();
  if (backWord.disabled) nextWord.focus();
});
nextWord.addEventListener("click", () => {
  cardIndex = (cardIndex + 1) % weeks[week].length;
  wordVisible = false;
  renderWord();
});

byId("show-cue").addEventListener("click", () => {
  byId("cue-text").textContent = `Montre ${vocabulary[rounds[roundIndex].key][0]}.`;
  cue.showModal();
});

nextQuestion.addEventListener("click", () => {
  roundIndex += 1;
  if (roundIndex === rounds.length) {
    byId("quiz-round").hidden = true;
    byId("quiz-end").hidden = false;
    byId("quiz-reset").focus();
  } else {
    renderQuestion();
    byId("show-cue").disabled = false;
    byId("show-cue").focus();
  }
});

byId("quiz-reset").addEventListener("click", () => {
  renderMode();
  byId("show-cue").focus();
});
byId("back-to-words").addEventListener("click", () => {
  cardIndex = 0;
  wordVisible = false;
  pickMode("discover");
  discoverButton.focus();
});

const workshop = byId("workshop");
const pieceList = byId("piece-list");
const colorList = byId("color-list");
const treeTargets = byId("tree-targets");
const drawingLayer = byId("tree-pieces");
const clothes = [...workshop.querySelectorAll("[data-clothing]")];
const undoWorkshop = byId("workshop-undo");
const clearWorkshop = byId("workshop-clear");
const phraseButton = byId("outfit-phrase");
const speechExample = byId("oral-example");
const workshopFeedback = byId("workshop-feedback");

const paintColors = {
  rouge: { shade: "#D87D7D" },
  bleu: { shade: "#739FCD", feminine: "bleue" },
  vert: { shade: "#8BB381", feminine: "verte" },
  jaune: { shade: "#EDCB70" },
  rose: { shade: "#EAA7C1" },
  violet: { shade: "#A18AC2", feminine: "violette" },
  orange: { shade: "#E6A56B", invariable: true },
  noir: { shade: "#565363", feminine: "noire" }
};

const pieceIconBoxes = {
  boule: "-32 -39 64 71",
  guirlande: "-134 -32 268 75",
  etoile: "-42 -42 84 84",
  manteau: "-123 133 246 151",
  pantalon: "-58 241 116 105",
  bottes: "-97 306 194 80",
  bonnet: "-70 -12 171 97"
};

const decorations = {
  boule: { label: "Boules", name: "une boule", example: "en bas du sapin" },
  guirlande: { label: "Guirlandes", name: "une guirlande", example: "au milieu du sapin" },
  etoile: { label: "Étoiles", name: "une étoile", example: "tout en haut du sapin" }
};

const garmentNames = {
  manteau: { label: "Manteau", name: "un manteau" },
  pantalon: { label: "Pantalon", name: "un pantalon" },
  bottes: { label: "Bottes", name: "des bottes", feminine: true, plural: true },
  bonnet: { label: "Bonnet", name: "un bonnet" }
};

const treePositions = [
  { id: "sommet", x: 180, y: 47, phrase: "tout en haut du sapin", starOnly: true },
  { id: "haut-gauche", x: 143, y: 120, phrase: "en haut à gauche" },
  { id: "haut-centre", x: 180, y: 120, phrase: "en haut au centre" },
  { id: "haut-droite", x: 217, y: 120, phrase: "en haut à droite" },
  { id: "milieu-gauche", x: 124, y: 187, phrase: "au milieu à gauche" },
  { id: "milieu-centre", x: 180, y: 187, phrase: "au centre du sapin" },
  { id: "milieu-droite", x: 236, y: 187, phrase: "au milieu à droite" },
  { id: "bas-gauche", x: 91, y: 258, phrase: "en bas à gauche" },
  { id: "bas-centre", x: 180, y: 257, phrase: "en bas au centre" },
  { id: "bas-droite", x: 269, y: 258, phrase: "en bas à droite" },
  { id: "bord-gauche", x: 130, y: 290, phrase: "en bas, près du bord gauche" },
  { id: "bord-droite", x: 230, y: 290, phrase: "en bas, près du bord droit" },
  { id: "guirlande-haut", x: 180, y: 137, phrase: "en haut du sapin", scale: .34 },
  { id: "guirlande-milieu", x: 180, y: 200, phrase: "au milieu du sapin", scale: .54 },
  { id: "guirlande-bas", x: 180, y: 267, phrase: "en bas du sapin", scale: .78 }
];

const workshopStates = {
  tree: { selected: "boule", color: "rouge", pieces: {}, history: [] },
  santa: { selected: "manteau", pieces: {}, history: [], showPhrase: false }
};

function activeWorkshop() {
  return week === 0 ? "tree" : "santa";
}

function colorWord(key, feminine = false, plural = false) {
  const color = paintColors[key];
  const adjective = (feminine && color.feminine) || key;
  return plural && !color.invariable ? adjective + "s" : adjective;
}

function addExample(label, sentence) {
  const caption = document.createElement("span");
  caption.textContent = label;
  const text = document.createElement("strong");
  text.textContent = sentence;
  speechExample.replaceChildren(caption, text);
}

function selectColor(color) {
  const kind = activeWorkshop();
  const state = workshopStates[kind];
  if (kind === "tree") {
    state.color = color;
  } else if (state.pieces[state.selected] !== color) {
    state.history.push(state.pieces);
    state.pieces = { ...state.pieces, [state.selected]: color };
    const garment = garmentNames[state.selected];
    workshopFeedback.textContent = `${garment.name} ${colorWord(color, garment.feminine, garment.plural)}.`;
  }
  paintWorkshop();
}

function placeDecoration(position) {
  const state = workshopStates.tree;
  const existing = state.pieces[position.id];
  if (existing?.item === state.selected && existing.color === state.color) return;
  state.history.push(state.pieces);
  state.pieces = { ...state.pieces, [position.id]: { item: state.selected, color: state.color } };
  workshopFeedback.textContent = `${decorations[state.selected].name} ${colorWord(state.color, true)} ${position.phrase}.`;
  paintWorkshop();
}

function paintTree(state) {
  const positions = [...treePositions].sort((a, b) => Number(!!b.scale) - Number(!!a.scale));
  drawingLayer.replaceChildren(...positions.flatMap((position) => {
    const piece = state.pieces[position.id];
    if (!piece) return [];
    const image = document.createElementNS("http://www.w3.org/2000/svg", "use");
    const size = position.scale || (position.starOnly ? .66 : .47);
    const y = position.scale ? position.y - 16 * position.scale : position.y;
    image.setAttribute("href", "#noel-" + piece.item);
    image.setAttribute("transform", `translate(${position.x} ${y}) scale(${size})`);
    image.style.setProperty("--piece", paintColors[piece.color].shade);
    return [image];
  }));
  for (const [i, button] of Array.from(treeTargets.children).entries()) {
    const position = treePositions[i];
    button.hidden = position.scale ? state.selected !== "guirlande" :
      state.selected === "guirlande" || (position.starOnly && state.selected !== "etoile");
    button.classList.toggle("occupied", Boolean(state.pieces[position.id]));
    button.setAttribute("aria-label",
      `Placer ${decorations[state.selected].name} ${colorWord(state.color, true)} ${position.phrase}`);
  }
  const piece = decorations[state.selected];
  addExample("Exemple de consigne à dire", `Accroche ${piece.name} ${colorWord(state.color, true)} ${piece.example}.`);
}

function paintOutfit(state) {
  for (const layer of clothes) {
    const color = state.pieces[layer.dataset.clothing];
    layer.toggleAttribute("hidden", !color);
    if (color) layer.style.setProperty("--piece", paintColors[color].shade);
  }
  const items = Object.keys(garmentNames).filter((key) => state.pieces[key]).map((key) => {
    const garment = garmentNames[key];
    return `${garment.name} ${colorWord(state.pieces[key], garment.feminine, garment.plural)}`;
  });
  const description = items.length < 2 ? items[0] :
    items.slice(0, -1).join(", ") + " et " + items.at(-1);
  const show = state.showPhrase && Boolean(description);
  phraseButton.disabled = !description;
  phraseButton.textContent = show ? "Masquer la phrase" : "Afficher la phrase";
  phraseButton.setAttribute("aria-expanded", String(show));
  speechExample.hidden = !description;
  if (description) addExample("À dire à un camarade", show ? `Il porte ${description}.` : "Qu’est-ce qu’il porte ?");
}

function paintWorkshop() {
  const kind = activeWorkshop();
  const state = workshopStates[kind];
  const color = kind === "tree" ? state.color : state.pieces[state.selected];
  for (const button of pieceList.children) {
    button.setAttribute("aria-pressed", String(button.dataset.piece === state.selected));
  }
  for (const button of colorList.children) {
    button.setAttribute("aria-pressed", String(button.dataset.color === color));
  }
  undoWorkshop.disabled = state.history.length === 0;
  clearWorkshop.disabled = Object.keys(state.pieces).length === 0;
  if (kind === "tree") {
    speechExample.hidden = false;
    paintTree(state);
  } else {
    paintOutfit(state);
  }
}

function renderWorkshop() {
  const kind = activeWorkshop();
  const isTree = kind === "tree";
  const state = workshopStates[kind];
  workshop.dataset.workshop = kind;
  byId("workshop-title").textContent = isTree ? "Décore le sapin" : "Habille le père Noël";
  byId("peer-instruction").textContent = isTree ?
    "Un camarade te dit quoi accrocher. Choisis la décoration et sa couleur, puis touche un emplacement." :
    "Choisis les vêtements et les couleurs. Ton camarade décrit ce que porte le père Noël.";
  byId("piece-label").textContent = isTree ? "Décoration" : "Vêtement";
  byId("tree-scene").hidden = !isTree;
  byId("santa-scene").hidden = isTree;
  phraseButton.hidden = isTree;
  workshopFeedback.textContent = "";
  pieceList.replaceChildren(...Object.entries(isTree ? decorations : garmentNames).map(([key, piece]) => {
    const button = document.createElement("button");
    button.className = "piece-option";
    button.type = "button";
    button.dataset.piece = key;
    const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    icon.setAttribute("viewBox", pieceIconBoxes[key]);
    icon.setAttribute("aria-hidden", "true");
    const shape = document.createElementNS("http://www.w3.org/2000/svg", "use");
    shape.setAttribute("href", "#noel-" + key);
    icon.append(shape);
    button.append(icon, piece.label);
    button.addEventListener("click", () => {
      state.selected = key;
      paintWorkshop();
    });
    return button;
  }));
  paintWorkshop();
}

colorList.replaceChildren(...Object.entries(paintColors).map(([name, color]) => {
  const button = document.createElement("button");
  button.className = "color-option";
  button.type = "button";
  button.dataset.color = name;
  const dot = document.createElement("span");
  dot.className = "color-dot";
  dot.style.backgroundColor = color.shade;
  dot.setAttribute("aria-hidden", "true");
  button.append(dot, name[0].toUpperCase() + name.slice(1));
  button.addEventListener("click", () => selectColor(name));
  return button;
}));

treeTargets.replaceChildren(...treePositions.map((position) => {
  const button = document.createElement("button");
  button.className = "tree-target";
  button.type = "button";
  button.dataset.position = position.id;
  button.style.left = `${position.x / 360 * 100}%`;
  button.style.top = `${position.y / 405 * 100}%`;
  button.addEventListener("click", () => placeDecoration(position));
  return button;
}));

undoWorkshop.addEventListener("click", () => {
  const state = workshopStates[activeWorkshop()];
  state.pieces = state.history.pop();
  workshopFeedback.textContent = "Dernier changement annulé.";
  paintWorkshop();
});

clearWorkshop.addEventListener("click", () => {
  const state = workshopStates[activeWorkshop()];
  state.history.push(state.pieces);
  state.pieces = {};
  state.showPhrase = false;
  workshopFeedback.textContent = activeWorkshop() === "tree" ? "Le sapin est prêt à être décoré." : "Le père Noël est prêt à être habillé.";
  paintWorkshop();
});

phraseButton.addEventListener("click", () => {
  const state = workshopStates.santa;
  state.showPhrase = !state.showPhrase;
  paintOutfit(state);
});

byId("finish-star").src = images.etoile;
renderMode();
if (new URLSearchParams(location.search).get("activite") === "histoire") selectStory(true);
</script>
</body>
</html>
