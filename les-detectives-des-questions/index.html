<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les détectives des questions • FLE Lab</title>
<style>
:root{--ink:#23324c;--paper:#fcf8ef;--purple:#6851ba;--mint:#d9eee3;--line:#dedbd3;--orange:#f1b459}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.5 ui-rounded,'Arial Rounded MT Bold',Arial,sans-serif}button,select{font:inherit}button{cursor:pointer;border:2px solid var(--line);border-radius:17px;background:white;color:var(--ink);padding:12px 20px;min-height:52px;transition:background .15s,transform .15s}button:hover:not(:disabled){border-color:var(--purple);transform:translateY(-1px)}button:focus-visible,select:focus-visible{outline:4px solid #ea9d30;outline-offset:4px}button:disabled{cursor:default;opacity:.5}.primary{background:var(--purple);color:white;border-color:var(--purple);font-weight:bold}.secondary{background:var(--mint);border-color:var(--mint)}.small{font-size:15px;min-height:42px;padding:7px 13px}header{max-width:1100px;margin:auto;padding:20px 26px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:17px;font-weight:bold;letter-spacing:1px}.badge{font-size:12px;letter-spacing:1px;background:#ece8f8;color:#57409a;border-radius:30px;padding:6px 12px}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.wrap{max-width:1020px;margin:auto;padding:10px 26px 50px}.hero{display:grid;grid-template-columns:1fr 180px;align-items:center;gap:25px;margin:18px 0 30px}.eyebrow{color:#76529a;font-weight:bold;font-size:13px;letter-spacing:2px}h1{font-size:clamp(30px,5vw,49px);line-height:1.12;letter-spacing:-1px;margin:12px 0 18px}h2{font-size:26px;line-height:1.3;margin:12px 0}h3{margin:8px 0;font-size:21px}p{margin:10px 0}.muted{color:#626a78;font-size:15px}.settings{display:flex;flex-wrap:wrap;gap:28px;background:white;border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:26px}.setting label{font-size:14px;font-weight:bold;display:block;margin-bottom:8px}.pills{display:flex;gap:6px}.pills button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:white}.activities{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.activity{text-align:left;padding:24px;display:flex;flex-direction:column;align-items:flex-start;border-radius:24px;min-height:265px;box-shadow:0 5px 0 #e5e0d7}.number{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:#eee7fa;font-size:24px;font-weight:bold;margin-bottom:14px}.activity:nth-child(2) .number{background:#dbefe5}.activity:nth-child(3) .number{background:#fce6bd}.activity p{font-size:16px;font-weight:normal}.activity span:last-child{margin-top:auto;font-size:14px;font-weight:bold;color:#6851ba}.section-note{margin:26px 0 12px}.progress{display:flex;align-items:center;gap:15px;margin:14px 0 20px;font-size:14px}.track{height:10px;flex:1;background:#e5e0d7;border-radius:15px;overflow:hidden}.fill{height:100%;background:var(--purple);transition:width .3s}.panel{background:white;border:1px solid var(--line);border-radius:25px;padding:28px;box-shadow:0 6px 0 #e5e0d7}.instruction{font-size:15px;color:#606879}.reply{border-radius:19px;background:#e6f2eb;padding:22px;margin:22px 0}.reply .quote{font-size:clamp(23px,3vw,31px);font-weight:bold;margin:8px 0}.prompt{font-size:clamp(24px,3vw,32px);font-weight:bold;margin:24px 0}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.option{font-size:23px;font-weight:bold;padding:20px}.option.bad{background:#fff0e4;border-color:#bd7135}.option.good{background:#dcf1e5;border-color:#2b825f}.answerbox{background:#f7f5fa;border:2px dashed #d8cee9;border-radius:17px;min-height:90px;padding:14px;margin:22px 0 15px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.placeholder{font-size:16px;color:#7b7487}.tokens{display:flex;flex-wrap:wrap;gap:10px;min-height:80px}.token{font-size:20px;padding:12px 17px}.actions{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:24px}.actions-group{display:flex;gap:9px;flex-wrap:wrap}.feedback{border-radius:16px;padding:14px 18px;margin-top:18px;font-size:17px}.feedback:empty{display:none}.feedback.ok{background:#e0f3e7}.feedback.retry{background:#fff0dc}.hint{font-size:15px;color:#6b596d;padding-top:9px}.scene{display:grid;grid-template-columns:160px 1fr;gap:20px;align-items:center;background:#faf5e9;border:1px solid #eee1c8;padding:20px;border-radius:20px;margin:22px 0}.target{display:inline-block;background:#f7dca5;border-radius:9px;padding:5px 10px;font-weight:bold}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.chip{background:#f0f3f6;border-radius:8px;padding:5px 9px;font-size:14px}.result{text-align:center;max-width:710px;margin:35px auto}.result>svg{width:130px}.result .big{font-size:70px;color:var(--purple);font-weight:bold;line-height:1.3}.category-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.help-card{border:1px solid var(--line);border-radius:14px;padding:13px}.help-card b{color:var(--purple)}dialog{border:0;border-radius:25px;max-width:760px;width:calc(100% - 30px);color:var(--ink);padding:25px;max-height:90vh}dialog::backdrop{background:#18243b99}footer{font-size:13px;color:#737782;text-align:center;margin:35px 0 5px}svg{max-width:100%;height:auto}.off{display:none!important}.audio-status{font-size:13px;color:#626a78;margin:8px 0}.result-list{text-align:left;background:white;padding:18px 24px;border-radius:17px}.audio{font-size:15px;min-height:40px;padding:7px 12px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:700px){header{padding:15px}.wrap{padding:8px 15px 35px}.hero{grid-template-columns:1fr 100px;gap:8px}.activities{grid-template-columns:1fr}.activity{min-height:170px}.panel{padding:19px}.scene{grid-template-columns:90px 1fr;padding:13px;gap:12px}.options{gap:9px}.option{font-size:20px;padding:15px}.category-grid{grid-template-columns:1fr}.settings{gap:15px}.toolbar .small{font-size:13px}h1{font-size:34px}.token{font-size:18px}.actions button{flex-grow:1}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

</head><body>
<header><div class="brand">FLE <span style="color:#8a68c8">LAB</span> <span class="badge">L’ATELIER DES QUESTIONS</span></div><div class="toolbar"><button class="small" id="homeBtn">Accueil</button><button class="small" id="helpBtn">Aide-mémoire</button></div></header>
<main class="wrap" id="app"></main>
<dialog id="help"><h2>Une question, une information</h2><div class="category-grid" id="helpCards"></div><p class="muted">« Est-ce que… ? » sert à poser une question à laquelle on répond par oui ou non. « Pourquoi… ? » demande une raison.</p><button class="primary" id="closeHelp">J’ai compris</button></dialog>
<script>
'use strict';
const TYPES=[['Qui','une personne','Qui joue avec toi ?','Lina.'],['Où','un lieu','Où joues-tu ?','Dans le jardin.'],['Quand','un moment','Quand pars-tu ?','Demain.'],['Comment','une manière, un moyen, un état…','Comment vas-tu ?','Je vais bien.'],["Qu’est-ce que",'une chose ou une action',"Qu’est-ce que tu dessines ?",'Un chat.'],['Est-ce que','une réponse par oui ou non','Est-ce que tu aimes les animaux ?','Oui.'],['Pourquoi','une raison','Pourquoi portes-tu un manteau ?','Parce que j’ai froid.']];
const mk=(type,q,a,tokens)=>({type,q,a,tokens});
const BANK={CE1:[
mk(0,'Qui est ton meilleur ami ?','Mon meilleur ami, c’est Léo.',['Qui','est ton meilleur ami','?']),mk(0,'Qui joue avec toi ?','Lina joue avec moi.',['Qui','joue avec toi','?']),
mk(1,'Où joues-tu ?','Je joue dans le jardin.',['Où','joues-tu','?']),mk(1,'Où manges-tu ?','Je mange à la cantine.',['Où','manges-tu','?']),
mk(2,'Quand vas-tu à la piscine ?','Je vais à la piscine samedi.',['Quand','vas-tu','à la piscine','?']),mk(2,'Quand pars-tu en vacances ?','Je pars en vacances demain.',['Quand','pars-tu','en vacances','?']),
mk(3,'Comment tu vas aujourd’hui ?','Je vais bien.',['Comment','tu vas','aujourd’hui','?']),mk(3,'Comment tu vas à l’école ?','Je vais à l’école en bus.',['Comment','tu vas','à l’école','?']),
mk(4,'Qu’est-ce que tu dessines ?','Je dessine un chat.',['Qu’est-ce que','tu dessines','?']),mk(4,'Qu’est-ce que tu manges ?','Je mange une pomme.',['Qu’est-ce que','tu manges','?']),
mk(5,'Est-ce que tu aimes les animaux ?','Oui, j’aime les animaux.',['Est-ce que','tu aimes','les animaux','?']),mk(5,'Est-ce que tu sais nager ?','Non, je ne sais pas nager.',['Est-ce que','tu sais nager','?']),
mk(6,'Pourquoi tu portes un manteau ?','Parce que j’ai froid.',['Pourquoi','tu portes','un manteau','?']),mk(6,'Pourquoi tu es content ?','Parce que c’est mon anniversaire.',['Pourquoi','tu es content','?'])
],CE2:[
mk(0,'Qui parle aux élèves ?','Le directeur parle aux élèves.',['Qui','parle','aux élèves','?']),mk(0,'Qui prépare le dîner ?','Ma sœur prépare le dîner.',['Qui','prépare','le dîner','?']),
mk(1,'Où allez-vous ?','Nous allons au musée.',['Où','allez-vous','?']),mk(1,'Où les enfants jouent-ils ?','Les enfants jouent dans la cour.',['Où','les enfants','jouent-ils','?']),
mk(2,'Quand commence la fête ?','La fête commence vendredi.',['Quand','commence','la fête','?']),mk(2,'Quand commence le spectacle ?','Le spectacle commence à huit heures.',['Quand','commence','le spectacle','?']),
mk(3,'Comment se déplace un escargot ?','Un escargot se déplace lentement.',['Comment','se déplace','un escargot','?']),mk(3,'Comment ton frère va à l’école ?','Mon frère va à l’école à vélo.',['Comment','ton frère','va','à l’école','?']),
mk(4,'Qu’est-ce que vous préparez pour la fête ?','Nous préparons un gâteau pour la fête.',['Qu’est-ce que','vous préparez','pour la fête','?']),mk(4,'Qu’est-ce que tu as découvert pendant la sortie scolaire ?','J’ai découvert un château pendant la sortie scolaire.',['Qu’est-ce que','tu as découvert','pendant la sortie scolaire','?']),
mk(5,'Est-ce que tu sais faire du vélo ?','Oui, je sais faire du vélo.',['Est-ce que','tu sais','faire du vélo','?']),mk(5,'Est-ce que tu as déjà visité un autre pays ?','Non, je n’ai jamais visité un autre pays.',['Est-ce que','tu as déjà visité','un autre pays','?']),
mk(6,'Pourquoi faut-il se laver les mains avant de manger ?','Parce qu’il faut enlever les microbes.',['Pourquoi','faut-il','se laver les mains','avant de manger','?']),mk(6,'Pourquoi les plantes ont-elles besoin d’eau ?','Parce que l’eau leur permet de grandir.',['Pourquoi','les plantes','ont-elles besoin','d’eau','?'])
]};
// Chaque dossier possède sept informations ; une seule est masquée à chaque manche.
const SCENES=[{title:'La fête de Lina',icon:'party',context:'Lina organise une fête. Retrouve une information sur cette fête.',facts:['Personne','Lieu','Moment','Transport','Préparation','Invitation','Raison'],items:[
mk(0,'Qui prépare la fête ?','Lina prépare la fête.',['Qui','prépare','la fête','?']),mk(1,'Où se passe la fête ?','La fête se passe au parc.',['Où','se passe','la fête','?']),mk(2,'Quand commence la fête ?','La fête commence samedi.',['Quand','commence','la fête','?']),mk(3,'Comment Lina va à la fête ?','Lina va à la fête à vélo.',['Comment','Lina va','à la fête','?']),mk(4,'Qu’est-ce que Lina prépare ?','Lina prépare un gâteau.',['Qu’est-ce que','Lina prépare','?']),mk(5,'Est-ce que Lina invite ses amis ?','Oui, Lina invite ses amis.',['Est-ce que','Lina invite','ses amis','?']),mk(6,'Pourquoi Lina organise une fête ?','Parce que c’est son anniversaire.',['Pourquoi','Lina organise','une fête','?'])
]},{title:'La sortie de la classe',icon:'school',context:'La classe prépare une sortie. Retrouve une information sur cette sortie.',facts:['Accompagnateur','Destination','Départ','Transport','Objet à emporter','Participation','But'],items:[
mk(0,'Qui accompagne la classe ?','La maîtresse accompagne la classe.',['Qui','accompagne','la classe','?']),mk(1,'Où va la classe ?','La classe va au musée.',['Où','va','la classe','?']),mk(2,'Quand part la classe ?','La classe part demain.',['Quand','part','la classe','?']),mk(3,'Comment la classe va au musée ?','La classe va au musée en bus.',['Comment','la classe va','au musée','?']),mk(4,'Qu’est-ce que tu emportes ?','J’emporte mon sac.',['Qu’est-ce que','tu emportes','?']),mk(5,'Est-ce que tu viens avec la classe ?','Oui, je viens avec la classe.',['Est-ce que','tu viens','avec la classe','?']),mk(6,'Pourquoi la classe va au musée ?','Parce qu’elle veut découvrir les animaux.',['Pourquoi','la classe va','au musée','?'])
]}];
let level='CE1',mode='solo',activity=0,rounds=[],index=0,first=0,errors=0,helped=false,done=false,selected=[],tokens=[];
const app=document.getElementById('app'),$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mark(text,cls=''){return `<span class="${cls}">${esc(text)}</span>`}
function magnify(){return `<svg viewBox="0 0 180 180" role="img" aria-label="Une loupe de détective"><circle cx="82" cy="72" r="55" fill="#e8e0f6"/><circle cx="82" cy="72" r="39" fill="#fff" stroke="#293b52" stroke-width="9"/><path d="m111 106 36 39" stroke="#293b52" stroke-width="20" stroke-linecap="round"/><text x="65" y="90" fill="#7352b6" font-size="54" font-family="Arial" font-weight="bold">?</text><circle cx="23" cy="142" r="9" fill="#edb95f"/></svg>`}
function sceneSVG(icon){return icon==='party'?`<svg viewBox="0 0 160 140" role="img" aria-label="Dossier d’une fête"><rect x="10" y="25" width="140" height="105" rx="18" fill="#e8def7"/><path d="M20 25 Q80 55 140 25" fill="none" stroke="#6e53ae" stroke-width="3"/><path d="m35 32 8 18 9-14m24 2 9 18 9-20m22-5 9 18 9-21" fill="#f2b75a"/><rect x="45" y="92" width="70" height="27" rx="7" fill="#fff"/><path d="M45 96h70" stroke="#efa3ad" stroke-width="10"/><path d="M80 92V72" stroke="#6e53ae" stroke-width="5"/><ellipse cx="80" cy="65" rx="5" ry="9" fill="#efb74c"/></svg>`:`<svg viewBox="0 0 160 140" role="img" aria-label="Dossier d’une sortie scolaire"><rect x="8" y="25" width="144" height="105" rx="18" fill="#dceee5"/><path d="M25 70 80 38 135 70" fill="#adbbd6" stroke="#32425a" stroke-width="4"/><rect x="35" y="70" width="90" height="45" fill="#fff"/><path d="M48 75v35m31-35v35m31-35v35" stroke="#bccbde" stroke-width="9"/><path d="M26 117h110" stroke="#32425a" stroke-width="5"/></svg>`}
function home(){activity=0;app.innerHTML=`<section class="hero"><div><div class="eyebrow">MISSION : BIEN POSER SES QUESTIONS</div><h1>Les détectives<br>des questions</h1><p>Choisis les bons mots, construis tes questions<br>et découvre les indices cachés.</p></div>${magnify()}</section><section class="settings" aria-label="Réglages du jeu"><div class="setting"><label>Ton niveau</label><div class="pills">${['CE1','CE2'].map(l=>`<button data-level="${l}" aria-pressed="${level===l}">${l}</button>`).join('')}</div></div><div class="setting"><label>Comment jouer ?</label><div class="pills"><button data-mode="solo" aria-pressed="${mode==='solo'}">En autonomie</button><button data-mode="class" aria-pressed="${mode==='class'}">En classe</button></div></div></section><div class="activities">${[['Trouve le bon début','Lis une réponse et choisis le bon début de question.'],['Construis la question','Touche les étiquettes pour les mettre dans le bon ordre.'],['Mène l’enquête','Une information manque dans le dossier. Construis la question pour la découvrir.']].map((a,i)=>`<button class="activity" data-start="${i+1}"><span class="number">${i+1}</span><h3>${a[0]}</h3><p>${a[1]}</p><span>Ouvrir la mission →</span></button>`).join('')}</div><p class="section-note muted">10 manches par mission · sans chronomètre · indices et nouvelles tentatives</p><p class="muted">Les 7 débuts sont travaillés : qui, où, quand, comment, qu’est-ce que, est-ce que et pourquoi.</p><footer>Jeu autonome hors ligne • Aucun compte nécessaire<br>Jeu visuel • Sans audio</footer>`;
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;home()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;home()});document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(Number(b.dataset.start)));}
function start(n){activity=n;const types=shuffle([0,1,2,3,4,5,6]);types.push(...shuffle([0,1,2,3,4,5,6]).slice(0,3));rounds=types.map(type=>{if(n===3){let scene=SCENES[Math.floor(Math.random()*SCENES.length)];let item=scene.items[type];return {...item,scene}}return {...shuffle(BANK[level].filter(q=>q.type===type))[0]}});index=0;first=0;renderRound()}
function current(){return rounds[index]}
function renderRound(){errors=0;helped=false;done=false;selected=[];let q=current();tokens=shuffle(q.tokens.map((text,id)=>({text,id})));if(level==='CE2'&&activity>1)tokens.push({text:q.type===6?'Quand':'Pourquoi',id:99});let title=['','Trouve le bon début','Construis la question','Mène l’enquête'][activity];app.innerHTML=`<div class="progress"><span>${level} · ${mode==='class'?'Mode classe':'Autonomie'}</span><div class="track"><div class="fill" style="width:${index*10}%"></div></div><b>${index+1} / 10</b></div><section class="panel"><div class="eyebrow">MISSION ${activity}</div><h2 id="roundTitle" tabindex="-1">${title}</h2><p class="instruction">${activity===1?'Lis la réponse. Choisis le début de question qui convient.':activity===2?'Retrouve la question qui correspond à la réponse. Touche les étiquettes dans l’ordre.':'Lis l’information recherchée. Construis une question avec les étiquettes.'} ${activity>1?'Commence par le mot interrogatif et termine par « ? ».':''}</p>${activity===3?scenePanel(q):`<div class="reply"><div class="eyebrow">LA RÉPONSE</div><div class="quote">${esc(q.a)}</div></div>`}<div id="work"></div><div id="feedback" role="status" aria-live="polite" class="feedback"></div><div id="hint" class="hint"></div><div class="actions"><div class="actions-group"><button id="hintBtn" class="small">Un indice</button>${mode==='class'?'<button id="revealBtn" class="small">Afficher la correction</button>':''}</div><div class="actions-group">${activity>1?'<button id="resetBtn">Effacer</button><button class="primary" id="checkBtn">Vérifier</button>':''}<button class="primary off" id="nextBtn">Manche suivante →</button></div></div></section>`;
if(activity===1)renderOptions();else renderTokens();$('#hintBtn').onclick=hint;$('#nextBtn').onclick=next;if($('#revealBtn'))$('#revealBtn').onclick=reveal;if($('#resetBtn'))$('#resetBtn').onclick=()=>{selected=[];renderTokens()};if($('#checkBtn'))$('#checkBtn').onclick=validate;$('#roundTitle').focus();}
function scenePanel(q){let s=q.scene;return `<div class="scene">${sceneSVG(s.icon)}<div><h3>${esc(s.title)}</h3><p class="muted">${esc(s.context)}</p><p><span class="target">À découvrir : ${esc(s.facts[q.type])}</span></p><p id="secret"><b>Information cachée : ?</b></p><p class="muted">${q.type===5?'Tu veux savoir si la réponse est oui ou non.':`Ta question doit demander ${TYPES[q.type][1]}.`}</p></div></div>`}
function renderOptions(){let q=current(),wrong=shuffle(TYPES.map((_,i)=>i).filter(i=>i!==q.type)).slice(0,level==='CE1'?2:3);let opts=shuffle([q.type,...wrong]);$('#work').innerHTML=`<div class="prompt">… ${esc(q.q.slice(TYPES[q.type][0].length).trim())}</div><div class="options">${opts.map(i=>`<button class="option" data-option="${i}">${esc(TYPES[i][0])}</button>`).join('')}</div>`;document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{if(done)return;if(Number(b.dataset.option)===q.type){b.classList.add('good');success()}else{errors++;b.classList.add('bad');b.disabled=true;feedback('Essaie encore. Cherche quelle information donne la réponse.','retry');hint(false)}})}
function renderTokens(){let area=$('#work');area.innerHTML=`<div class="answerbox" aria-label="Ta question">${selected.length?selected.map(id=>{let tok=tokens.find(t=>t.id===id);return `<button class="token" data-remove="${id}" ${done?'disabled':''}>${esc(tok.text)}</button>`}).join(''):'<span class="placeholder">Ta question apparaîtra ici…</span>'}</div><div class="tokens" aria-label="Étiquettes disponibles">${tokens.filter(t=>!selected.includes(t.id)).map(t=>`<button class="token" data-token="${t.id}" ${done?'disabled':''}>${esc(t.text)}</button>`).join('')}</div>`;document.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{selected.push(Number(b.dataset.token));renderTokens()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selected=selected.filter(id=>id!==Number(b.dataset.remove));renderTokens()});}
function feedback(s,kind){let f=$('#feedback');f.className='feedback '+kind;f.textContent=s}
function hint(count=true){if(count)helped=true;const q=current();$('#hint').textContent=`Indice : ${TYPES[q.type][0]} → ${TYPES[q.type][1]}.`}
function validate(){if(done)return;const q=current();if(!selected.length){feedback('Touche les étiquettes pour construire ta question.','retry');return}const attempt=selected.map(id=>tokens.find(t=>t.id===id).text).join(' ');if(attempt===q.tokens.join(' ')){success()}else{errors++;feedback('Pas encore. Vérifie le début, l’ordre des mots et le point d’interrogation.','retry');if(errors>=2)hint(false)}}
function success(revealed=false){if(done)return;done=true;let q=current();if(!revealed&&errors===0&&!helped)first++;feedback((revealed?'Voici la question : ':'Bien joué ! ')+q.q,'ok');if(activity===3){$('#secret').textContent=q.a;}$('#nextBtn').classList.remove('off');$('#nextBtn').textContent=index===9?'Voir le bilan →':'Manche suivante →';['#hintBtn','#revealBtn','#checkBtn','#resetBtn'].forEach(id=>{if($(id))$(id).disabled=true});document.querySelectorAll('[data-option]').forEach(b=>b.disabled=true);if(activity>1)renderTokens();}
function reveal(){helped=true;if(activity>1){selected=current().tokens.map((_,id)=>id);renderTokens()}success(true)}
function next(){index++;if(index===rounds.length)finish();else renderRound()}
function finish(){app.innerHTML=`<section class="panel result">${magnify()}<div class="eyebrow">MISSION TERMINÉE</div><h1>Bravo, détective !</h1>${mode==='solo'?`<div class="big">${first} / 10</div><p>questions réussies du premier coup, sans indice.</p><p class="muted">Tu as revu les 10 questions, avec des indices si nécessaire.</p>`:'<p>Vous avez travaillé les 10 questions ensemble.</p>'}<div class="result-list"><b>Les 7 débuts de question ont été travaillés.</b><p class="muted">Pour continuer à l’oral : invente une question et demande à un camarade d’y répondre.</p></div><div class="actions"><button id="backMenu">Changer de mission</button><button class="primary" id="replay">Rejouer</button></div></section>`;$('#replay').onclick=()=>start(activity);$('#backMenu').onclick=home;}
$('#homeBtn').onclick=home;$('#helpCards').innerHTML=TYPES.map(t=>`<div class="help-card"><b>${esc(t[0])} ?</b><div>${esc(t[1])}</div><p class="muted">${esc(t[2])}<br>→ ${esc(t[3])}</p></div>`).join('');$('#helpBtn').onclick=()=>{$('#help').showModal();};$('#closeHelp').onclick=()=>{$('#help').close();};home();
</script></body></html>
