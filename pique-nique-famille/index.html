<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#71608e"><title>Le pique-nique en famille</title><link rel="stylesheet" href="styles.css?v=3"></head>
<body><header><a href="../" aria-label="Mes jeux de français">← Mes jeux</a><h1>Le pique-nique en famille</h1><span class="badge">Niveau 1</span></header>
<main>
 <section id="home" class="welcome"><span class="eyebrow">J’écoute · Je lis · Je choisis</span><h2>Bienvenue au pique-nique !</h2><p>Écoute les mots, puis prépare les sandwichs de la famille.</p><img src="assets/scene.webp" alt="Une famille aux grandes oreilles partage un pique-nique à la campagne."><div class="choices"><button id="discover"><span>🔊</span><strong>1 · Je découvre les mots</strong><small>Les objets de table, puis les aliments</small></button><button id="sandwich"><span>🥪</span><strong>2 · Je prépare les sandwichs</strong><small>Écoute la commande et choisis les ingrédients</small></button></div><p><a class="quiet" href="../marche-fruits/?marche=2">Niveau 2 · Au marché des fruits →</a></p></section>
 <section id="play" hidden>
  <div class="topline"><button id="back" class="quiet">← Les deux petits jeux</button><strong id="progress"></strong></div>
  <div id="dialogue" hidden><button id="question" class="question bubble" aria-label="Écouter la question"><span aria-hidden="true">🔊</span> Qu’est-ce que tu veux manger ?</button><button id="command" class="bubble command"><span aria-hidden="true">🔊</span><span id="commandText"></span></button></div>
  <div class="board"><aside id="words" aria-label="Les mots à écouter"></aside><div class="scene-wrap"><div id="scene" class="scene"><img class="background" src="assets/scene.webp" alt="Le garçon, son père, sa mère et la fille, avec leurs pains et leurs verres sur la nappe."><div id="fillings"></div><div id="targets"></div><div id="ingredients"></div><div id="labels"></div><div id="speaker" hidden></div></div><p id="instruction" class="instruction"></p></div></div>
  <div class="bottom"><p id="feedback" role="status" aria-live="polite"></p><div class="actions"><button id="clear" class="quiet" hidden>Vider mon sandwich</button><button id="verify" class="primary" hidden>Vérifier mon sandwich</button><button id="next" class="primary" hidden>Continuer →</button></div></div>
 </section>
</main><footer>Prends ton temps. Clique sur 🔊 pour écouter autant de fois que tu veux.</footer><script type="module" src="app.js?v=4"></script><script src="../fullscreen.js?v=1" defer></script></body></html>
